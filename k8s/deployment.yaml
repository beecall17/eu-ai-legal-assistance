# k8s/deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: legal-assistant
  labels:
    app: legal-assistant
spec:
  replicas: 1  # Scale to 2+ if needed (read-only mode for ChromaDB)
  selector:
    matchLabels:
      app: legal-assistant
  template:
    metadata:
      labels:
        app: legal-assistant
    spec:
      containers:
      - name: legal-assistant
        image: beecall17/eu-ai-legal-assistant:latest  # Replace with your image
        ports:
        - containerPort: 8000
        env:
        - name: AI_MODEL
          valueFrom:
            configMapKeyRef:
              name: legal-assistant-config
              key: AI_MODEL
        - name: VLLM_BASE_URL
          valueFrom:
            configMapKeyRef:
              name: legal-assistant-config
              key: VLLM_BASE_URL
        - name: OPENAI_API_KEY
          valueFrom:
            secretKeyRef:
              name: legal-assistant-secrets
              key: OPENAI_API_KEY
        - name: GROQ_API_KEY
          valueFrom:
            secretKeyRef:
              name: legal-assistant-secrets
              key: GROQ_API_KEY
        - name: GEMINI_API_KEY
          valueFrom:
            secretKeyRef:
              name: legal-assistant-secrets
              key: GEMINI_API_KEY
        volumeMounts:
        - name: chromadb-storage
          mountPath: /app/data/chromadb
        resources:
          requests:
            memory: "1Gi"
            cpu: "500m"
          limits:
            memory: "2Gi"
            cpu: "1000m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 10
          periodSeconds: 5
      volumes:
      - name: chromadb-storage
        persistentVolumeClaim:
          claimName: chromadb-pvc